# GitLance's old address, the `RELAY` of GitLance 1.3.0: every request goes on to Artoo's relay
# (`../wrangler.toml`) as it came. Deleted once Artoo 2.0.0 is out (#173).
name = "gitlance-reports"
main = "worker.js"
compatibility_date = "2025-09-01"

# A binding, not a fetch: one Worker may not fetch another on the same workers.dev (error 1042).
[[services]]
binding = "RELAY"
service = "artoo-reports"
