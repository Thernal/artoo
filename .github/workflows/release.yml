name: Release

# A `release/v*` tag (its version must be Cargo.toml's) builds Artoo for macOS, Windows and Linux and
# attaches the files to a GitHub release. Unsigned: README → Releases says how to open them.
# Run by hand (Actions → Release → Run workflow) it only builds: the files stay on the run.
on:
  push:
    tags: ['release/v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Rust a release and its SDK are built with, which a plugin is built with too (sdk.txt). Pinned because
  # Cargo 1.100 no longer writes the `deps` folder the SDK and the packages are taken from (its new build-dir
  # layout); a later Rust waits until `.github/sdk-asset.sh` reads that layout.
  RUST: 1.99.1

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#release/v}" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $crate"
            exit 1
          fi
          # A release says what is new in it (#135): its section of CHANGELOG.md, before anything builds.
          if [ "$GITHUB_REF_TYPE" = tag ] && ! .github/release-notes.sh --check "$crate"; then
            echo "::error::CHANGELOG.md has no section for $crate"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  # The two macOS architectures build side by side, each with its own cache (#155); `macos` joins them.
  macos-build:
    name: macOS (${{ matrix.target }})
    needs: version
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The plugins' SDK and the libstd it links travel with the binary (#175).
      - name: Build
        env:
          ARTOO_PACKAGED: 1
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p out
          cp target/${{ matrix.target }}/release/artoo target/${{ matrix.target }}/release/deps/libartoo_plugin_sdk.dylib out/
          cp "$(rustc --print target-libdir --target ${{ matrix.target }})"/libstd-*.dylib out/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out/*
          retention-days: 1
      # What a plugin is built against for this target (#175), attached to the release.
      - name: The plugins' SDK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          T: ${{ matrix.target }}
        run: |
          build=$(dwarfdump --uuid "target/$T/release/deps/libartoo_plugin_sdk.dylib" | awk '{print $2; exit}')
          sh .github/sdk-asset.sh "target/$T/release/deps" target/release/deps "$T" "$build" "$VERSION" sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.target }}
          path: sdk/*
          compression-level: 0
          retention-days: 3

  macos:
    name: macOS (universal)
    needs: [version, macos-build]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bin
      - name: Join
        run: |
          mkdir -p target libs
          lipo -create -output target/artoo-universal \
            bin/bin-aarch64-apple-darwin/artoo \
            bin/bin-x86_64-apple-darwin/artoo
          # An artifact keeps no file modes.
          chmod +x target/artoo-universal
          # Each library a universal one when both architectures have it under one name (libstd's may differ).
          for lib in $(cd bin && ls bin-*/*.dylib | xargs -n1 basename | sort -u); do
            lipo -create -output "libs/$lib" bin/bin-*/"$lib"
          done
      - name: Bundle
        run: |
          ARTOO_BIN=target/artoo-universal ARTOO_LIBS=libs ./bundle.sh
          mkdir -p dist dmg
          ditto -c -k --keepParent target/Artoo.app "dist/Artoo-$VERSION-macos.zip"
          cp -R target/Artoo.app dmg/
          ln -s /Applications dmg/Applications
          # Sized from the folder by hdiutil, the image came out too small on macos-26 ("No space left on
          # device"): the folder's size, a fifth more and 20 MB.
          size=$(du -sm dmg | cut -f1)
          hdiutil create -volname Artoo -srcfolder dmg -size "$((size + size / 5 + 20))m" -ov -format UDZO \
            "dist/Artoo-$VERSION-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, pkg/Artoo | Out-Null
          Copy-Item target/release/artoo.exe pkg/Artoo/Artoo.exe
          # The plugins' SDK and the std it links, beside the .exe where Windows looks first (#175).
          Copy-Item target/release/deps/artoo_plugin_sdk.dll pkg/Artoo/
          Copy-Item "$(rustc --print target-libdir)/std-*.dll" pkg/Artoo/
          Copy-Item README.md, LICENSE pkg/Artoo/
          New-Item -ItemType Directory -Force pkg/Artoo/licenses | Out-Null
          Copy-Item assets/icons/intellij/LICENSE pkg/Artoo/licenses/intellij-icons-LICENSE
          Copy-Item assets/icons/intellij/NOTICE pkg/Artoo/licenses/intellij-icons-NOTICE
          Copy-Item assets/emoji/LICENSE pkg/Artoo/licenses/gitlab-emoji-LICENSE
          Compress-Archive -Path pkg/Artoo -DestinationPath "dist/Artoo-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
      # What a plugin is built against (#175); the app beside its libraries says which SDK build this is.
      - name: The plugins' SDK
        shell: bash
        run: |
          build=$(pkg/Artoo/Artoo.exe sdk-build)
          sh .github/sdk-asset.sh target/release/deps target/release/deps x86_64-pc-windows-msvc "$build" "$VERSION" sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-x86_64-pc-windows-msvc
          path: sdk/*
          compression-level: 0
          retention-days: 3

  linux:
    name: Linux
    needs: version
    # The oldest supported runner: the binary then runs on systems with an older glibc too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        run: sh .github/linux-deps.sh
      - name: Build
        env:
          ARTOO_PACKAGED: 1
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist "pkg/artoo-$VERSION"
          cp target/release/artoo README.md LICENSE assets/linux/artoo.desktop "pkg/artoo-$VERSION/"
          # The plugins' SDK and the libstd it links (#175): beside the binary in the archive, `../lib` in the AppImage.
          libs="target/release/deps/libartoo_plugin_sdk.so $(rustc --print target-libdir)/libstd-*.so"
          cp $libs "pkg/artoo-$VERSION/"
          cp assets/icon.png "pkg/artoo-$VERSION/artoo.png"
          mkdir -p "pkg/artoo-$VERSION/licenses"
          cp assets/icons/intellij/LICENSE "pkg/artoo-$VERSION/licenses/intellij-icons-LICENSE"
          cp assets/icons/intellij/NOTICE "pkg/artoo-$VERSION/licenses/intellij-icons-NOTICE"
          cp assets/emoji/LICENSE "pkg/artoo-$VERSION/licenses/gitlab-emoji-LICENSE"
          tar -C pkg -czf "dist/artoo-$VERSION-linux-x86_64.tar.gz" "artoo-$VERSION"

          app=Artoo.AppDir
          mkdir -p "$app/usr/bin" "$app/usr/lib" "$app/usr/share/icons/hicolor/512x512/apps"
          cp target/release/artoo "$app/usr/bin/"
          cp $libs "$app/usr/lib/"
          cp assets/linux/artoo.desktop "$app/"
          cp assets/icon.png "$app/artoo.png"
          cp assets/icon.png "$app/usr/share/icons/hicolor/512x512/apps/artoo.png"
          mkdir -p "$app/usr/share/licenses/artoo"
          cp "pkg/artoo-$VERSION/licenses/"* "$app/usr/share/licenses/artoo/"
          ln -s usr/bin/artoo "$app/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$app" "dist/Artoo-$VERSION-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
      # What a plugin is built against (#175). A packaged binary has no path to the toolchain's libstd.
      - name: The plugins' SDK
        run: |
          build=$(LD_LIBRARY_PATH="$(rustc --print target-libdir)" target/release/artoo sdk-build)
          sh .github/sdk-asset.sh target/release/deps target/release/deps x86_64-unknown-linux-gnu "$build" "$VERSION" sdk
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-x86_64-unknown-linux-gnu
          path: sdk/*
          compression-level: 0
          retention-days: 3

  publish:
    name: GitHub release
    needs: [version, macos, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      # The tags and history: the notes list the commits since the release before (#135).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Each artifact in a folder of its own: the macOS binaries joined into the universal one stay out.
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          pre=
          case "$VERSION" in *-*) pre=--prerelease ;; esac
          .github/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/macos/* dist/windows/* dist/linux/* dist/sdk-*/* --repo "$GITHUB_REPOSITORY" \
            --title "Artoo $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $pre
