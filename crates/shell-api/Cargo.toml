[package]
name = "artoo-shell-api"
description = "The shell's contract (#165): what a feature adds to the window and asks of it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# The places a frame names (`Places::web`).
artoo-core = { path = "../core" }
# A part draws with the kit: the text selection a frame hands it is the kit's markdown's.
artoo-ui-kit = { path = "../ui-kit" }
gpui.workspace = true

[dev-dependencies]
# A test writes none of the user's files: a choice of notices, the notices read (`platform::sandboxed`).
artoo-core = { path = "../core", features = ["sandbox"] }
# A test app the registries are offered in (`notices`).
gpui = { workspace = true, features = ["test-support"] }
