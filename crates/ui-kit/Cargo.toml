[package]
name = "artoo-ui-kit"
description = "Artoo's design system: theme, interface size, icons, keys, motion, rows that give way (#165)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
artoo-core = { path = "../core" }
chrono.workspace = true
# The composer keeps the commit a note on a file in Code is written at.
git2.workspace = true
gpui.workspace = true
regex.workspace = true

[features]
# A snapshot run (the app's `snapshot`) draws motion's end state.
snapshot = []

[dev-dependencies]
artoo-core = { path = "../core", features = ["sandbox"] }
# A test app the toasts are made in (`toast`).
gpui = { workspace = true, features = ["test-support"] }
