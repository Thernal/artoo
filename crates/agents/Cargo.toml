[package]
name = "artoo-agents"
description = "Coding agents: the MCP server, agent-watch, comments sent to a chat and their answers, notes (#165)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
artoo-core = { path = "../core" }
# Its contract, which `install` provides.
artoo-agents-api = { path = "../agents-api" }
# `mcp` reads requests through the hosts' contract; the app hands it the implementation.
artoo-hosts-api = { path = "../hosts-api" }
git2.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Tests of a crate that calls this one: the core's guard.
sandbox = ["artoo-core/sandbox"]

[dev-dependencies]
artoo-core = { path = "../core", features = ["sandbox"] }
# The real hosts over their fixtures (`fixture::TEST_FIXTURE`).
artoo-hosts = { path = "../hosts", features = ["sandbox"] }
tempfile.workspace = true
