[package]
name = "artoo-agents"
description = "Coding agents: the MCP server, agent-watch, comments sent to a chat and their answers, notes (#165)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
artoo-core = { path = "../core" }
# `mcp` reads requests through `mr` until stage 3's `Host` trait (#165).
artoo-hosts = { path = "../hosts" }
git2.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Tests of a crate that calls this one: the core's guard and the hosts' fixtures.
sandbox = ["artoo-core/sandbox", "artoo-hosts/sandbox"]

[dev-dependencies]
artoo-core = { path = "../core", features = ["sandbox"] }
artoo-hosts = { path = "../hosts", features = ["sandbox"] }
tempfile.workspace = true
