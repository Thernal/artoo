[package]
name = "artoo-requests"
description = "Merge requests (#165 stage 4): what the tab keeps of them — the lists, the request open, its discussions and the changes sent to its host."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
artoo-core = { path = "../core" }
# The New merge request form reads the branches listed.
artoo-branches-api = { path = "../branches-api" }
artoo-hosts-api = { path = "../hosts-api" }
# A request's images open whole in the tab's viewer (#211).
artoo-images-api = { path = "../images-api" }
# The Inbox lists the agents' answers among the notices (`Agents::inbox_answers`).
artoo-agents-api = { path = "../agents-api" }
artoo-requests-api = { path = "../requests-api" }
artoo-shell-api = { path = "../shell-api" }
# How far your review of a request got: the list groups by it.
artoo-review-api = { path = "../review-api" }
artoo-ui-kit = { path = "../ui-kit" }
anyhow.workspace = true
git2.workspace = true
gpui.workspace = true
