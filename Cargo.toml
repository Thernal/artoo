[workspace]
# The app (this package) and its crates (#165): a feature crate never depends on another one.
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "2.0.0-rc.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tempfile = "3"
anyhow = "1"
# Image sizes from their headers, for image review (already in GPUI's dependency graph).
imagesize = "0.14"
# GitLab names a diff line by the SHA-1 of its file's path (already in GPUI's graph).
sha1_smol = "1"
# GitHub names a diff's file by the SHA-256 of its path, for a link to it (#162; already in the
# dependency graph).
sha2 = "0.10"
# PNG pictures: a snapshot's, and the window's a report carries (#118; already in GPUI's graph).
image = { version = "0.25", default-features = false, features = ["png"] }
# A report's picture goes to the relay as base64 (#118; already in the dependency graph).
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# Which release is newer than this build (#135; already in the dependency graph).
semver = "1"
# Folder icons by the user's rules (#95; already in the dependency graph).
regex = "1"
# The working tree's changes from the file system (FSEvents on macOS), so git is asked only then (#87).
notify = "8"
serde_json = "1"
# Dates in the local time zone (already in GPUI's dependency graph).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
pulldown-cmark = { version = "0.13", default-features = false }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# GPUI is pre-1.0: pinned to the gpui-pre snapshot of zed@279fe07. An upgrade is its own change.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["runtime_shaders", "font-kit"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = "0.5"
# Highlighting from a parse tree for the main languages (#13, D23); syntect stays for the rest.
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-language = "0.1"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
# Whether an agent's process still runs (`platform::alive`).
libc = "0.2"
# Plugins (#175): a plugin's stamp and the SDK's identity read from their files (already in the dependency graph),
# a plugin loaded with every symbol bound (already in GPUI's graph), and on Windows the SDK's file found.
object = { version = "0.37", default-features = false, features = ["read", "std"] }
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader"] }
# Which plugin's code was on the stack as the app ended (#178; already in the dependency graph).
backtrace = "0.3"
# A plugin's release asset (#176).
zip = { version = "9", default-features = false, features = ["deflate"] }
# The key window's picture for a report, its own window only (#118; already in GPUI's graph).
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAccessibility", "NSApplication", "NSDockTile", "NSImage", "NSResponder", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSData", "NSString", "NSURL"] }
# Whether macOS lets Artoo post notifications (#196; already in GPUI's graph).
objc2-user-notifications = "0.3"
block2 = "0.6"

[package]
name = "artoo"
version.workspace = true
edition.workspace = true
description = "Review commits, branch versions and merge requests, and send line comments to your coding agent — without an IDE and without worktrees."
license.workspace = true
publish = false

[dependencies]
artoo-core = { path = "crates/core" }
artoo-appearance = { path = "crates/appearance" }
artoo-updates = { path = "crates/updates" }
artoo-hosts = { path = "crates/hosts" }
artoo-hosts-api = { path = "crates/hosts-api" }
artoo-shell = { path = "crates/shell" }
artoo-shell-api = { path = "crates/shell-api" }
artoo-code = { path = "crates/code" }
artoo-code-api = { path = "crates/code-api" }
artoo-agents = { path = "crates/agents" }
artoo-agents-api = { path = "crates/agents-api" }
artoo-reports = { path = "crates/reports" }
artoo-requests = { path = "crates/requests" }
artoo-requests-api = { path = "crates/requests-api" }
artoo-review = { path = "crates/review" }
artoo-review-api = { path = "crates/review-api" }
artoo-branches = { path = "crates/branches" }
artoo-branches-api = { path = "crates/branches-api" }
artoo-ui-kit = { path = "crates/ui-kit" }
artoo-images = { path = "crates/images" }
artoo-plugin-sdk = { path = "crates/plugin-sdk" }
artoo-plugins = { path = "crates/plugins" }
anyhow.workspace = true
imagesize.workspace = true
sha1_smol.workspace = true
sha2.workspace = true
image.workspace = true
base64.workspace = true
serde.workspace = true
semver.workspace = true
regex.workspace = true
notify.workspace = true
serde_json.workspace = true
chrono.workspace = true
pulldown-cmark.workspace = true
git2.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
syntect.workspace = true
two-face.workspace = true
tree-sitter.workspace = true
tree-sitter-highlight.workspace = true
tree-sitter-language.workspace = true
tree-sitter-kotlin-ng.workspace = true
tree-sitter-java.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-swift.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-python.workspace = true
tree-sitter-json.workspace = true
tree-sitter-yaml.workspace = true
tree-sitter-md.workspace = true

# Linux windows through X11 and Wayland (features add up with the line above).
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["x11", "wayland"] }

# Whether an agent's process still runs (`platform::alive`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

# The `.exe`'s icon (build.rs): Explorer, the taskbar and the window, which GPUI loads as icon 1.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# `ARTOO_SNAPSHOT=<file.png>` renders the window to a PNG and quits — UI checks without screen access.
snapshot = ["gpui/test-support", "gpui_platform/test-support", "artoo-core/snapshot", "artoo-ui-kit/snapshot"]

[dev-dependencies]
tempfile.workspace = true
# A test app the features are installed in, with no window (the contributions check, `ui::tests`).
gpui = { workspace = true, features = ["test-support"] }
# The core's tests guard for the app's tests too (`platform::sandboxed`).
artoo-core = { path = "crates/core", features = ["sandbox"] }
artoo-hosts = { path = "crates/hosts", features = ["sandbox"] }
artoo-agents = { path = "crates/agents", features = ["sandbox"] }

# A dev build keeps line tables alone: a panic's backtrace still says where, and a build writes and links a fraction
# of the debug info (#165).
[profile.dev]
debug = "line-tables-only"
